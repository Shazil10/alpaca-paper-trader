name: Manual Order

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Ticker to liquidate (cancel open orders + sell all shares)
        required: true
        default: NVO
        type: string

jobs:
  liquidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cancel open orders and sell position
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          PYTHONPATH: src
        run: python scripts/liquidate_symbol.py "${{ inputs.symbol }}"
