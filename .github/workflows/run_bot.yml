name: Daily Trading Bot

on:
  #schedule:
    # Runs at 9:30 AM ET (14:30 UTC during standard time; 13:30 UTC during daylight time)
    # If you want this to always be 9:30am New York time year-round, consider moving to a timezone-aware scheduler.
    #- cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          PYTHONPATH: src
        run: |
          echo "Python $(python --version)"
          python src/universe.py
          python src/trade.py
          python src/report.py

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-reports
          path: reports/