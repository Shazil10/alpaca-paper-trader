name: Daily Trading Bot

on:
  schedule:
    # 9:30 AM ET: 13:30 UTC during EDT (summer), 14:30 UTC during EST (winter).
    # Both fire; runner_gate.py decides which one is really the open window.
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  # Read-only would do for trading itself; kept as before so report steps that
  # may write are unaffected. The price lake is committed by sync_data.yml.
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: DST time gate
        id: gate
        env:
          PYTHONPATH: src
        run: |
          python src/runner_gate.py open 2>&1 | tee /tmp/gate.out
          if grep -q "GATE_RESULT=skip" /tmp/gate.out; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No universe refresh and no price sync here any more. Both moved to
      # sync_data.yml, which runs after the previous evening's close and
      # commits completed Alpaca SIP bars, the unfiltered membership capture
      # and the screened universe.csv. This job only reads what that job
      # committed -- the checkout above already has it -- so a data-vendor
      # problem can no longer race the open, and the 09:30 run never stores a
      # partial bar.
      #
      # (Paths committed by any workflow stay explicit, never `git add -A`:
      # src/strategies/momentum/clenow_trend.py is 0 bytes locally after an
      # iCloud eviction and a broad add would push the empty file.)

      - name: Run Trading Bot
        if: steps.gate.outputs.skip != 'true'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          PYTHONPATH: src
          # Single control point for the data source. Phase 6 flips this to
          # `lake` once several consecutive sessions of current bars have been
          # observed. Strategies never fall back between sources.
          PRICE_SOURCE: yfinance
        run: |
          echo "Python $(python --version)"
          python src/trade.py
          python src/report.py

      - name: Report price lake status
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          echo "price lake is written by the after-close sync_data workflow"
          python - <<'PY'
          from data_pipeline import store
          last = store.last_bar_date()
          print(f"price lake newest session: {last}")
          gaps = store.find_gaps()
          print(f"symbols with gaps: {len(gaps)}")
          PY

      - name: Upload reports artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trading-reports
          path: reports/
