# Time-series momentum across 24 cross-asset ETFs.
#
# The one sleeve that can be tested on real history: every ticker it trades is an
# ETF, and the lake carries all 24 back to inception (2005-01-03 for most, with
# DBA/DBB/HYG/UNG starting 2007 and SLV/USO 2006). So this window contains 2008,
# 2011, 2015-16, 2018Q4 and 2022 -- the drawdowns that decide whether a trend
# follower is worth running.
#
# Starting 2007-01-01 rather than 2005: the 12-month lookback plus the 60-day vol
# halflife needs about 14 months of warm-up, and waiting until 2007 also lets
# DBA/DBB/HYG/UNG list so the book is not silently narrower at the start.
strategy_id: tsmom_etf_cross_asset
strategy_module: strategies.momentum.tsmom_etf
start_date: "2007-06-01"
end_date: "2026-08-21"
initial_capital: 100000
benchmark: SPY

cost:
  spread_bps: 5
  slippage_bps: 5
  commission_per_share: 0.0
  participation_rate: 0.05

# Leverage is the strategy, not an accident. Sizing every position to contribute
# 40% annualized volatility means an ETF running at 13% realized vol asks for 3x
# notional; measured gross is a median of 2.26x long-only and 3.12x long-short,
# reaching 4.3x. Capping below that would backtest a different strategy, so the
# limits are set above the observed range and the honest caveat is in the notes.
risk:
  max_position_pct: 1.00
  max_sector_pct: 1.0
  cash_reserve_pct: 0.0
  max_leverage: 5.0
  max_positions: 24

execution:
  fill_type: MARKET_OPEN
  fill_delay_days: 1
  fractional_shares: false
  delisting_return: -0.30

params:
  lookback_months: 12
  vol_halflife: 60
  sigma_target: 0.40
  # The engine has no short side yet, so the long-short stream cannot be run
  # through it. This is the long-only variant, which is the notebook's `lo`
  # stream. Flip to false once short support lands.
  long_only: true

# Fixed ETF book, not index members.
universe_source: etf_rotation
price_source: lake
price_adjustment: asof
trial_index: 0
random_seed: 42
notes: >
  Phase 7 migration run, and the first sleeve with a genuinely long sample.
  Two caveats. There is no financing model, so a book running at 2-3x borrows at
  zero and levered stretches are overstated by roughly the broker call rate on
  the borrowed portion -- material over nineteen years. And this is the long-only
  variant: the short leg is what makes time-series momentum a crisis hedge, so
  the 2008 and 2022 numbers here understate the strategy as researched.
